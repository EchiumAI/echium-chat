AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time setup for GitHub Actions to deploy this app via OIDC.
  Creates the GitHub OIDC identity provider (if missing) and an IAM role
  trusted only to specific GitHub Actions OIDC subjects (the `prod`-environment
  deploy jobs of the repos that share this role — echium-chat and echium-docs).
  The role is granted the permissions CDK needs to deploy this stack.

Parameters:
  RoleName:
    Type: String
    Default: github-actions-echium-deploy
    Description: Name for the IAM role that GitHub Actions will assume.

  TrustedSubjects:
    Type: CommaDelimitedList
    Default: 'repo:EchiumAI/echium-chat:environment:prod,repo:EchiumAI@287532042/echium-docs@1374325976:environment:prod'
    Description: >
      OIDC `sub` claims allowed to assume this role. Scoped to the `prod`
      GitHub Environment of each repo that shares this role, so only
      environment-gated deploy jobs can assume it — never an arbitrary branch
      or pull request. A job that references `environment: prod` gets the sub
      `<repo-prefix>:environment:prod`, which is why this is the correct scope
      and `ref:refs/tags/v*` is NOT — the deploy job never presents a ref-based
      sub.

      Note the two repos use DIFFERENT subject formats:
        - echium-chat predates GitHub's 2026-07-15 change, so it still emits the
          classic name-based subject `repo:EchiumAI/echium-chat:...`.
        - echium-docs was created after that date, so GitHub forces the
          IMMUTABLE subject with numeric owner/repo IDs
          (`repo:EchiumAI@287532042/echium-docs@1374325976:...`). There is no
          opt-out; the numbers are the permanent org id (287532042) and repo id
          (1374325976), so this is stable across renames. echium-chat will move
          to the immutable form if it is ever renamed/transferred or opts in.

      Protect the `prod` environment and make the `v*.*.*` tags immutable in each
      repo's settings to complete the chain.

  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Set to 'false' if your account already has the GitHub OIDC provider
      (token.actions.githubusercontent.com). Only one is allowed per account.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  # GitHub's OIDC identity provider. One per AWS account, idempotent across stacks.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # GitHub publishes these thumbprints; AWS also verifies the cert chain
      # automatically since 2023, so any valid value here is accepted.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # The role GitHub Actions assumes via OIDC.
  # Trust is locked to the exact subjects in TrustedSubjects (the prod-environment
  # deploy jobs of echium-chat and echium-docs). Permissions are broad
  # (AdministratorAccess) because CDK needs to provision diverse resources
  # (CloudFront, Cognito, Lambda, IAM, OpenSearch, etc.). The trust policy
  # is the security boundary, not the permission policy.
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: 'Assumed by GitHub Actions (prod deploy jobs of echium-chat and echium-docs) to run cdk deploy.'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Immutable, environment-scoped subjects (see TrustedSubjects).
                # StringEquals (not StringLike) means no wildcards: only these
                # exact subjects — the `prod`-environment deploy jobs — may
                # assume the role. Branches, PRs, and moved/forged refs cannot.
                token.actions.githubusercontent.com:sub: !Ref TrustedSubjects
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  RoleArn:
    Description: ARN to use in the GitHub Actions workflow's role-to-assume.
    Value: !GetAtt GitHubActionsDeployRole.Arn

  RoleName:
    Description: Name of the IAM role.
    Value: !Ref GitHubActionsDeployRole
